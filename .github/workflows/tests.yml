name: tests

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 在无显示环境仍需这些系统库
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 参考文档由代码生成，改代码没重新生成文档时这里会给出明确提示
      - name: Docs up to date
        run: python scripts/gen_docs.py --check

      - name: Run tests
        run: python -m pytest
